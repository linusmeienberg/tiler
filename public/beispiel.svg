<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460">
  <!-- Test pattern with symmetry *442 (p4m): square cell of 90 px, offset from the image corner. -->
  <defs>
    <g id="corner">
      <polygon points="0,-26 26,0 0,26 -26,0" fill="#1e3a8a"/>
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#f5d06f"/>
    </g>
    <pattern id="tile" patternUnits="userSpaceOnUse" x="37" y="23" width="90" height="90">
      <rect width="90" height="90" fill="#f3e9d2"/>
      <path d="M0,0 L90,90 M90,0 L0,90" stroke="#9a3412" stroke-width="5"/>
      <rect x="25" y="25" width="40" height="40" fill="none" stroke="#166534" stroke-width="5"/>
      <circle cx="45" cy="45" r="11" fill="#b91c1c"/>
      <use href="#corner"/>
      <use href="#corner" x="90"/>
      <use href="#corner" y="90"/>
      <use href="#corner" x="90" y="90"/>
    </pattern>
  </defs>
  <rect width="640" height="460" fill="url(#tile)"/>
</svg>
