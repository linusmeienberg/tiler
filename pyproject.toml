[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiler"
version = "0.1.0"
description = "Interactively place a fundamental domain and preview the resulting wallpaper-group covering of the plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Linus Meienberg" }]
dependencies = [
    "numpy>=1.24",
    "ipywidgets>=8.0",
    "ipycanvas>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
